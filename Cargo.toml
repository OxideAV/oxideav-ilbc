[package]
name = "oxideav-ilbc"
version = "0.0.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-ilbc"
authors = ["Mark Karpeles"]
description = "Pure-Rust iLBC (Internet Low Bit Rate Codec, RFC 3951) audio decoder"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-ilbc"
keywords = ["multimedia", "audio", "ilbc", "telephony", "codec"]
categories = ["multimedia::encoding", "multimedia::audio"]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
# Round 180 (depth-mode benchmarks): Criterion drives three bench
# harnesses (`decode`, `encode`, `roundtrip`) so future iLBC
# optimisation rounds can A/B-test their tweaks to the LPC
# analysis, split-VQ LSF quantiser, start-state scalar coder,
# adaptive-codebook search, and synthesis + enhancer path against
# a stable, fixture-free baseline. Pinned to the same 0.5 line the
# other OxideAV crates with benches (flac, g711, tta, magicyuv,
# h264, cinepak, pixfmt) already track.
criterion = "0.5"

# Round 180 benches. Each binary lives in `benches/<name>.rs` and is
# self-contained — every PCM input is synthesised in-bench from a
# deterministic xorshift seed and fed through the public
# `oxideav_ilbc::encoder::make_encoder` /
# `decoder::make_decoder` trait objects. No `docs/` fixtures or
# external files are read. Run with:
#     cargo bench -p oxideav-ilbc --bench <name>
[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "roundtrip"
harness = false

# Round 235 bench. Times the RFC 3952 RTP payload pack / depack hot
# path (`oxideav_ilbc::rtp::{Packetiser, Depacketiser}`) — the
# transport-layer surface a streaming endpoint pays once per RTP
# packet. Six scenarios cover the per-mode pack, the per-mode
# depacketise (borrowed + owned), and a pack -> depack B2BUA-style
# round-trip. No `docs/` fixtures or external files are read; every
# input buffer is synthesised in-bench at the per-mode frame width
# (38 / 50 bytes).
[[bench]]
name = "rtp"
harness = false
